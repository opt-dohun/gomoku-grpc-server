services:
  gomoku-server:
    image: gomoku-server:latest
    build:
      context: .
      dockerfile: src/server/GomokuServer/Dockerfile
    expose:
      - "5224"
    restart: unless-stopped

  gomoku-client-web:
    image: gomoku-client-web:latest
    build:
      context: .
      dockerfile: src/client/GomokuClient.Web/Dockerfile
    ports:
      - "127.0.0.1:5051:5051"
    environment:
      - GameServerUrl=http://gomoku-server:5224
      - ASPNETCORE_ENVIRONMENT=Development
      - Auth__DatabasePath=/var/data/auth.db
      - Auth__DataProtectionKeysPath=/var/data/keys
    volumes:
      - gomoku-auth-data:/var/data
    depends_on:
      - gomoku-server
    restart: unless-stopped

volumes:
  gomoku-auth-data:
