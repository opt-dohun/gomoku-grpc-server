syntax = "proto3";

option csharp_namespace = "GomokuGame.Proto";

package gomoku;

// 빈 메시지 타입 정의
message Empty{}

message Position {
    int32 row = 1;
    int32 col = 2;
}

// 플레이어 정보
message PlayerInfo {
    string player_id = 1;
    string player_name = 2;
}

// 돌 정보
message Stone {
    Position position = 1;
    int32 player_number = 2;
}

// ===== 게임 관련 메시지 =====
message CreateRoomRequest {
    string room_name = 1;
    string creator_name = 2;
}

message CreateRoomResponse {
    string room_id = 1;
    PlayerInfo creator = 2;
}

// 여러개의 방 정보를 수신  repeated -> 리스트
message RoomList {
    repeated RoomInfo rooms = 1;
}

message RoomInfo {
    string room_id = 1;
    string room_name = 2;
    int32 player_count = 3;
    GameStatus status = 4;
}

enum GameStatus {
    WAITING = 0;
    PLAYING = 1;
    FINISHED = 2;
}

message JoinRoomRequest {
    string room_id = 1;
    string player_name = 2;
}

message JoinRoomResponse {
    string room_id = 1;
    PlayerInfo opponent = 2;
    int32 board_size = 3;
    bool is_player = 4;
    PlayerInfo joiner = 5;
}

message PlaceStoneRequest {
    string room_id = 1;
    string player_id = 2;
    Position position = 3;
}

message GameState {
    repeated Stone stones = 1;
    int32 current_player = 2;
    GameStatus status = 3;
    string winner_id = 4;
    int32 board_size = 5;
    repeated Position valid_moves = 6;
}

message ChatMessage {
    string player_name = 1;
    string message = 2;
    int64 timestamp = 3;
}

service GameService {
    // Unary: 방 생성
    rpc CreateRoom (CreateRoomRequest) returns (CreateRoomResponse);

    // Unary: 방 목록 조회
    rpc GetRoomList (Empty) returns (RoomList);

    // Unary: 방 입장
    rpc JoinRoom (JoinRoomRequest) returns (JoinRoomResponse);

    // Unary: 현재 게임 상태 조회 (stones 포함)
    rpc GetGameState (RoomInfo) returns (GameState);

    // Unary: 돌 놓기
    rpc PlaceStone (PlaceStoneRequest) returns (GameState);
    
    // Server Streaming: 게임 상태 실시간 수신
    rpc WatchGame (RoomInfo) returns (stream GameState);
    
    // Client Streaming: 채팅 전송
    rpc SendChat (stream ChatMessage) returns (Empty);
    
    // Bidirectional: 실시간 게임 플레이
    rpc PlayGame (stream PlaceStoneRequest) returns (stream GameState);
    
    // Unary: 게임 포기
    rpc Surrender (JoinRoomRequest) returns (GameState);
}